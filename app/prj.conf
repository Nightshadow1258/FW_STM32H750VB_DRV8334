# This file contains selected Kconfig options for the application.


# Enable Logging
CONFIG_LOG=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SHELL=y
# Use the console as the backend for logs
CONFIG_LOG_BACKEND_UART=y

# Optional: Ensure logs are processed immediately (useful for debugging crashes)
CONFIG_LOG_MODE_IMMEDIATE=y

CONFIG_GPIO=y

# SPI
CONFIG_SPI=y
#CONFIG_SHELL=y
#CONFIG_SPI_SHELL=y
#CONFIG_GPIO_SHELL=y
# SPI configuration for AS5047P

#CONFIG_SPI_ASYNC=n

# Enable AS5047P driver - not needed at the moment
CONFIG_SENSOR=y
# CONFIG_AS5047P=y

# Enable PWM for LED control
CONFIG_PWM=y
CONFIG_PWM_STM32=y

# enable floating point logging
CONFIG_CBPRINTF_FP_SUPPORT=y


CONFIG_QDEC_STM32=y

CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y


# Enable USB CDC ACM for console output
CONFIG_USB_DEVICE_STACK=y 
CONFIG_USB_CDC_ACM=y 
CONFIG_SERIAL=y 
CONFIG_UART_INTERRUPT_DRIVEN=y 
CONFIG_USB_DEVICE_PID=0x0001 
CONFIG_USB_DEVICE_VID=0xFEED

# Enable ADC support
CONFIG_ADC=y
CONFIG_ADC_STM32=y

CONFIG_FPU=y
CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_DSP_FASTMATH=y
CONFIG_CMSIS_DSP_INTERPOLATION=y